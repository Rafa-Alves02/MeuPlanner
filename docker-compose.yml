services:
  mysql:
    image: mysql:8.3
    container_name: meuplanner-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: meuplanner
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - meuplanner-mysql-data:/var/lib/mysql
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  meuplanner-mysql-data:
